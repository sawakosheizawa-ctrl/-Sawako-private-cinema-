<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sawako's Private Cinema 🎬</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #101018;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 25px 0;
}

h1 {
  color: #e8b4ff;
}

.subtitle {
  color: #c9c1d5;
}

.card {
  max-width: 700px;
  margin: 20px auto;
  padding: 22px;
  background: #1c1c29;
  border-radius: 16px;
}

input {
  width: 100%;
  padding: 13px;
  margin: 10px 0;
  border: 1px solid #555;
  border-radius: 9px;
  background: #101018;
  color: white;
}

button {
  padding: 12px 18px;
  background: #c58af0;
  color: #170d20;
  border: none;
  border-radius: 9px;
  font-weight: bold;
  cursor: pointer;
}

.movie {
  padding: 15px;
  margin: 12px 0;
  background: #292638;
  border-radius: 12px;
  overflow-wrap: anywhere;
}

.movie button {
  margin-top: 8px;
}

#player, #embed {
  display: none;
  width: 100%;
  min-height: 230px;
  margin-top: 18px;
  border: none;
  border-radius: 12px;
  background: black;
}

#status {
  color: #e8b4ff;
  overflow-wrap: anywhere;
}

footer {
  text-align: center;
  color: #aaa;
  margin: 35px 0;
}
</style>
</head>

<body>

<header>
  <h1>🎬 Sawako's Private Cinema</h1>
  <p class="subtitle">Your little world of movies 🌸</p>
</header>

<div class="card">
  <h2>🍿 Movie Library</h2>
  <p id="status">Loading movies...</p>
  <div id="movieList"></div>
</div>

<div class="card">
  <h2>▶️ Watch a Movie</h2>
  <p>Paste a supported video link below.</p>

  <input
    id="videoLink"
    type="url"
    placeholder="Paste movie link here"
  >

  <button onclick="playMovie(document.getElementById('videoLink').value)">
    Play Movie
  </button>

  <video id="player" controls playsinline></video>
  <iframe
    id="embed"
    allowfullscreen
    allow="autoplay; fullscreen; picture-in-picture"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>

  <p id="playStatus"></p>
</div>

<footer>
  Made with 🤍 for movie lovers
</footer>
